# 发布:推 kernel/v*、cli/v* 或 modules/*/v* tag 自动建 GitHub Release,notes
# 从根 CHANGELOG.md 摘取对应小节(如 "## identity v0.1.1 ...")。小节缺失时
# 兜底占位文案,不阻塞发布。
name: release

on:
  push:
    tags:
      - "kernel/v*"
      - "cli/v*"
      - "modules/*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog notes
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            kernel/*)  section="kernel ${tag#kernel/}" ;;
            cli/*)     section="cli ${tag#cli/}" ;;
            modules/*) mod="${tag#modules/}"; section="${mod%%/*} ${mod##*/}" ;;
            *)         section="$tag" ;;
          esac
          awk -v s="## ${section}" 'index($0,s)==1 {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "(no changelog section found for ${section} — see CHANGELOG.md)" > notes.md
          fi
          echo "--- notes for ${section} ---"
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
