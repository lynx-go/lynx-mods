version: v2

deps:
  - buf.build/googleapis/googleapis
  # grpcapi 声明语法（policy.proto）经 BSR 供给：本模块只 import 不持有，
  # 生成 inputs 仅 directory: proto，dep 文件不产码（Go 类型由 grpcapi 模块提供）。
  - buf.build/lynx-go/grpcapi
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    # AIP-131/133 风格：资源直出为响应（见仓库根 scaffold 同款注释）。
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
