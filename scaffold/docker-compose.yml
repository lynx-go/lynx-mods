services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: {{.AppName}}
      POSTGRES_PASSWORD: {{.AppName}}
      POSTGRES_DB: {{.AppName}}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{.AppName}}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
